name: build

# Docker Hub image (practice as in v8dock):
# requires repo secrets DOCKERHUB_USERNAME, DOCKERHUB_TOKEN (hub.docker.com)
'on':
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-qemu-action@v3

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - uses: docker/build-push-action@v6
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          build-args: |
            GIT_REV=${{ github.sha }}
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/nnm-rss:latest
            ${{ secrets.DOCKERHUB_USERNAME }}/nnm-rss:1
          cache-from: type=gha
          cache-to: type=gha,mode=max
